<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDI Voice Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #1e1b4b 0%, #1f2937 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        max-width: 1200px;
        width: 100%;
        align-items: center;
      }

      .orb-section {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 500px;
      }

      .orb-container {
        width: 300px;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chat-section {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .content {
        color: white;
        text-align: center;
      }

      .content h1 {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 16px;
        background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .content p {
        font-size: 14px;
        color: #d1d5db;
        margin-bottom: 24px;
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        padding: 6px 12px;
        background: rgba(124, 58, 237, 0.2);
        border: 1px solid rgba(124, 58, 237, 0.5);
        border-radius: 20px;
        font-size: 12px;
        color: #c084fc;
        font-weight: 600;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .orb-container {
          width: 200px;
          height: 200px;
        }

        .content h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="orb-section">
        <div class="orb-container" id="orb"></div>
      </div>
      <div class="chat-section" id="chat"></div>
      <div class="content">
        <div class="badge">MEDI Healthcare AI</div>
        <h1>Clinical Voice Assistant</h1>
        <p>
          Real-time multi-agent voice intake system with AI-powered patient
          analysis and clinical decision support.
        </p>
      </div>
    </div>

    <script type="module">
      import { MediAgentChat } from "/static/MediAgentChat.tsx";
      import { VoicePoweredOrb } from "/static/VoicePoweredOrb.tsx";

      // Render orb
      const orbContainer = document.getElementById("orb");
      if (orbContainer) {
        const orb = new VoicePoweredOrb({
          className: "w-full h-full",
          hue: 120,
          enableVoiceControl: true,
          voiceSensitivity: 1.5,
        });
        orbContainer.appendChild(orb.render());
      }

      // Render chat
      const chatContainer = document.getElementById("chat");
      if (chatContainer) {
        const chat = new MediAgentChat();
        chatContainer.appendChild(chat.render());
      }
    </script>
  </body>
</html>
